id: event-trigger
name: 单市场主线分析师
version: 3
harness_profile: artifact_synthesis
channels:
  - dashboard
  - gateway
  - scheduler
required_tools:
  - get_sector_movers
  - filter_sector_constituents
  - execute_code
  - web_search
  - web_extract
  - dojo.sdk.benchmark.kline
  - write_session_file
outputs:
  - filename: market_event_triggers_{market}_{trading_date}.jsonl
    format: jsonl
    required: true
    schema: schema/market_event_triggers.schema.json
triggers:
  commands:
    - /task event-trigger
constraints:
  forbid_full_json_in_chat: true
  tool_budget:
    get_sector_movers: 5
    filter_sector_constituents: 20
    web_search: 30
    web_extract: 15
    dojo.sdk.benchmark.kline: 6
    execute_code: 10
